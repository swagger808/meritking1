<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benim Web Sitem</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      background-color: #fff;
      color: #4facfe;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>Hoşgeldin! 🌐</h1>
  <p>Bu tamamen ücretsiz ve dinamik bir site.</p>
  <button onclick="showMessage()">Tıkla Bakalım 👀</button>

  <script>
    function showMessage() {
      alert("JavaScript başarıyla çalıştı! 🎉");
    }
  </script>
</body>
</html>
